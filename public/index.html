<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camp Resource Hub</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite"></main>
  <div id="toast" class="toast" role="status"></div>

  <template id="signin-template">
    <section class="signin-layout">
      <div class="signin-copy">
        <p class="eyebrow">Private camp workspace</p>
        <h1>Camp Resource Hub</h1>
        <p class="hero-subtitle">A focused space for 11 campers to share resources, chat, ask for help, post reminders, and keep useful links in one place.</p>
        <form id="signin-form" class="signin-form">
          <label>
            <span>Your name</span>
            <input name="name" autocomplete="name" placeholder="Nitish" required minlength="2">
          </label>
          <label>
            <span>Class invite code</span>
            <input name="inviteCode" placeholder="GENWISE" required>
          </label>
          <button class="primary-btn" type="submit">Enter Hub</button>
        </form>
      </div>
      <div class="signin-visual">
        <img class="hero-image" src="/assets/study-hub-hero.png" alt="Study desk with a laptop and resource cards">
        <div class="visual-stat">
          <strong>11-person camp</strong>
          <span>Private localhost prototype</span>
        </div>
      </div>
    </section>
  </template>

  <template id="dashboard-template">
    <section class="dashboard-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">CR</span>
          <div>
            <p class="eyebrow">Camp Resource Hub</p>
            <h1 id="welcome-title"></h1>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="sync-status" class="sync-status">Live sync on</span>
          <button id="theme-toggle" class="icon-btn" type="button" title="Toggle theme" aria-label="Toggle theme">T</button>
          <button id="logout-btn" class="ghost-btn" type="button">Sign Out</button>
        </div>
      </header>

      <section class="focus-band">
        <div>
          <p class="eyebrow">Camp dashboard</p>
          <h2 id="focus-title">Build the camp knowledge base</h2>
          <p id="focus-subtitle"></p>
        </div>
        <div class="focus-actions">
          <button id="new-resource-btn" class="primary-btn" type="button">Add Resource</button>
          <button id="new-request-btn" class="ghost-btn" type="button">Ask Camp</button>
        </div>
      </section>

      <section class="quick-stats" aria-label="Class hub summary">
        <div>
          <strong id="stat-resources">0</strong>
          <span>Resources</span>
        </div>
        <div>
          <strong id="stat-members">0/11</strong>
          <span>Campers</span>
        </div>
        <div>
          <strong id="stat-requests">0</strong>
          <span>Open Requests</span>
        </div>
        <div>
          <strong id="stat-completion">0%</strong>
          <span>Request Completion</span>
        </div>
      </section>

      <section class="folder-section">
        <div class="panel-heading">
          <h2>Subjects</h2>
          <button id="new-folder-btn" class="ghost-btn small" type="button">New Subject</button>
        </div>
        <div id="folder-list" class="folder-list"></div>
      </section>

      <section class="insight-strip" aria-label="Class insights">
        <article>
          <span>Top Tags</span>
          <div id="top-tags" class="tag-row"></div>
        </article>
        <article>
          <span>Leading Subjects</span>
          <div id="top-subjects" class="meter-list"></div>
        </article>
        <article>
          <span>Most Helpful</span>
          <p id="top-resource" class="insight-copy"></p>
        </article>
      </section>

      <section class="quick-find-grid" aria-label="Quick find">
        <article class="directory-panel">
          <div class="panel-heading">
            <h2>Find Resources</h2>
            <span class="mini-count">Quick list</span>
          </div>
          <div id="directory-list" class="directory-list"></div>
        </article>
        <article class="directory-panel">
          <div class="panel-heading">
            <h2>Find Campers</h2>
            <span id="directory-camper-count" class="mini-count">0/11</span>
          </div>
          <div id="camper-directory" class="camper-directory"></div>
        </article>
      </section>

      <section class="workspace-grid">
        <section class="main-column">
          <div class="toolbar">
            <div class="search-wrap">
              <span aria-hidden="true">S</span>
              <input id="search-input" type="search" placeholder="Search title, unit, teacher, tag, text">
            </div>
            <select id="type-filter" aria-label="Filter by type">
              <option value="all">All types</option>
              <option value="file">Files</option>
              <option value="text">Text</option>
              <option value="prompt">Prompts</option>
              <option value="link">Links</option>
              <option value="bookmarks">Bookmarks</option>
            </select>
            <select id="unit-filter" aria-label="Filter by unit">
              <option value="all">All units</option>
            </select>
            <select id="teacher-filter" aria-label="Filter by teacher">
              <option value="all">All teachers</option>
            </select>
            <select id="semester-filter" aria-label="Filter by semester">
              <option value="all">All semesters</option>
            </select>
          </div>

          <div id="resource-list" class="resource-list"></div>
          <p id="empty-resources" class="empty-state">No resources match this view.</p>
        </section>

        <aside class="side-column">
          <section class="side-panel campers-panel">
            <div class="panel-heading">
              <h2>Campers Joined</h2>
              <span id="camper-count" class="mini-count">0/11</span>
            </div>
            <div id="camper-list" class="camper-list"></div>
          </section>

          <section class="side-panel chat-panel">
            <div class="panel-heading">
              <h2>Camp Chat</h2>
              <span class="mini-count">11 people</span>
            </div>
            <div id="chat-list" class="chat-list"></div>
            <form id="chat-form" class="chat-form">
              <input name="body" placeholder="Message the camp" maxlength="1000" required>
              <button class="primary-btn compact" type="submit">Send</button>
            </form>
          </section>

          <section class="side-panel">
            <div class="panel-heading">
              <h2>Camp Pulse</h2>
            </div>
            <div id="pulse-list" class="pulse-list"></div>
          </section>

          <section class="side-panel">
            <div class="panel-heading">
              <h2>Requests</h2>
              <button id="side-request-btn" class="ghost-btn small" type="button">Ask</button>
            </div>
            <div id="request-list" class="stack-list"></div>
          </section>

          <section class="side-panel">
            <div class="panel-heading">
              <h2>Announcements</h2>
              <button id="new-announcement-btn" class="ghost-btn small" type="button">Post</button>
            </div>
            <div id="announcement-list" class="stack-list"></div>
          </section>

          <section class="side-panel">
            <div class="panel-heading">
              <h2>Recent Activity</h2>
            </div>
            <div id="activity-list" class="stack-list"></div>
          </section>
        </aside>
      </section>
    </section>

    <dialog id="resource-dialog" class="modal">
      <form id="resource-form" method="dialog" class="modal-content">
        <div class="modal-heading">
          <h2 id="resource-dialog-title">Add Resource</h2>
          <button class="icon-btn" value="cancel" type="button" data-close-dialog aria-label="Close">x</button>
        </div>
        <input type="hidden" name="id">
        <div class="type-picker" role="radiogroup" aria-label="Resource type">
          <label><input type="radio" name="type" value="file" checked> <span>File</span></label>
          <label><input type="radio" name="type" value="text"> <span>Text</span></label>
          <label><input type="radio" name="type" value="prompt"> <span>Prompt</span></label>
          <label><input type="radio" name="type" value="link"> <span>Link</span></label>
        </div>
        <div class="form-grid">
          <label>
            <span>Title</span>
            <input name="title" required maxlength="120">
          </label>
          <label>
            <span>Subject</span>
            <select name="subject"></select>
          </label>
        </div>
        <div class="form-grid three">
          <label>
            <span>Unit / Chapter</span>
            <input name="unit" maxlength="80" placeholder="Unit 2, Chapter 4">
          </label>
          <label>
            <span>Teacher</span>
            <input name="teacher" maxlength="80" placeholder="Prof. Sharma">
          </label>
          <label>
            <span>Semester</span>
            <input name="semester" maxlength="40" placeholder="Sem 3">
          </label>
        </div>
        <label>
          <span>Tags</span>
          <input name="tags" placeholder="exam, chapter-4, prompt">
        </label>
        <label>
          <span>Description</span>
          <textarea name="description" rows="3" maxlength="800"></textarea>
        </label>
        <label class="field-file">
          <span>File</span>
          <input name="file" type="file">
        </label>
        <label class="field-url is-hidden">
          <span>Link</span>
          <input name="url" type="url" placeholder="https://example.com">
        </label>
        <label class="field-content is-hidden">
          <span>Text or prompt</span>
          <textarea name="content" rows="7"></textarea>
        </label>
        <label class="check-row">
          <input name="pinned" type="checkbox">
          <span>Pin this resource</span>
        </label>
        <div class="modal-actions">
          <button class="ghost-btn" type="button" data-close-dialog>Cancel</button>
          <button class="primary-btn" type="submit">Save Resource</button>
        </div>
      </form>
    </dialog>

    <dialog id="request-dialog" class="modal">
      <form id="request-form" method="dialog" class="modal-content">
        <div class="modal-heading">
          <h2>Ask For A Resource</h2>
          <button class="icon-btn" value="cancel" type="button" data-close-dialog aria-label="Close">x</button>
        </div>
        <label>
          <span>What do you need?</span>
          <input name="title" required maxlength="120">
        </label>
        <div class="form-grid">
          <label>
            <span>Subject</span>
            <select name="subject"></select>
          </label>
          <label>
            <span>Unit / Chapter</span>
            <input name="unit" maxlength="80">
          </label>
        </div>
        <div class="form-grid">
          <label>
            <span>Teacher</span>
            <input name="teacher" maxlength="80">
          </label>
          <label>
            <span>Semester</span>
            <input name="semester" maxlength="40">
          </label>
        </div>
        <label>
          <span>Details</span>
          <textarea name="details" rows="5" maxlength="1000"></textarea>
        </label>
        <div class="modal-actions">
          <button class="ghost-btn" type="button" data-close-dialog>Cancel</button>
          <button class="primary-btn" type="submit">Post Request</button>
        </div>
      </form>
    </dialog>

    <dialog id="announcement-dialog" class="modal">
      <form id="announcement-form" method="dialog" class="modal-content">
        <div class="modal-heading">
          <h2>Post Announcement</h2>
          <button class="icon-btn" value="cancel" type="button" data-close-dialog aria-label="Close">x</button>
        </div>
        <label>
          <span>Announcement</span>
          <textarea name="text" rows="5" required maxlength="600"></textarea>
        </label>
        <div class="modal-actions">
          <button class="ghost-btn" type="button" data-close-dialog>Cancel</button>
          <button class="primary-btn" type="submit">Post</button>
        </div>
      </form>
    </dialog>

    <dialog id="folder-dialog" class="modal">
      <form id="folder-form" method="dialog" class="modal-content">
        <div class="modal-heading">
          <h2>New Subject</h2>
          <button class="icon-btn" value="cancel" type="button" data-close-dialog aria-label="Close">x</button>
        </div>
        <label>
          <span>Subject name</span>
          <input name="name" required maxlength="60" placeholder="Economics">
        </label>
        <div class="modal-actions">
          <button class="ghost-btn" type="button" data-close-dialog>Cancel</button>
          <button class="primary-btn" type="submit">Create Subject</button>
        </div>
      </form>
    </dialog>
  </template>

  <script src="/app.js"></script>
</body>
</html>
